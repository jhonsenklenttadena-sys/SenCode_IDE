<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Reconnect required</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, sans-serif;
    background: #0b0e14;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    box-sizing: border-box;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { font-size: 12px; color: #9aa0aa; margin: 0 0 20px; line-height: 1.5; }
  .row { display: flex; gap: 8px; width: 100%; }
  button {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  #retry { background: #4f8cff; color: white; }
  #cancel { background: #1c202a; color: #cfd3da; }
</style>
</head>
<body>
  <h1>SenCode needs to reconnect</h1>
  <p>
    It's been a while since this license was last verified online.
    Connect to the internet and try again — your license key itself
    is fine, nothing to re-enter.
  </p>
  <div class="row">
    <button id="cancel">Quit</button>
    <button id="retry">Retry</button>
  </div>

  <script>
    document.getElementById('retry').addEventListener('click', () => {
      window.licenseAPI.retry();
    });
    document.getElementById('cancel').addEventListener('click', () => {
      window.licenseAPI.cancel();
    });
  </script>
</body>
</html>
