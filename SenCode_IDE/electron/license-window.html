<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Activate SenCode</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, sans-serif;
    background: #0b0e14;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    box-sizing: border-box;
    padding: 24px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { font-size: 12px; color: #9aa0aa; margin: 0 0 16px; text-align: center; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #2a2f3a;
    background: #12151c;
    color: #e6e6e6;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .error {
    color: #ff6b6b;
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 8px;
  }
  .row { display: flex; gap: 8px; width: 100%; }
  button {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    cursor: pointer;
  }
  #activate { background: #4f8cff; color: white; }
  #cancel { background: #1c202a; color: #cfd3da; }
</style>
</head>
<body>
  <h1>Activate SenCode</h1>
  <p>Enter the license key you received after purchase.</p>
  <input id="key" placeholder="XXXX-XXXX-XXXX-XXXX" autofocus />
  <div class="error" id="error"></div>
  <div class="row">
    <button id="cancel">Quit</button>
    <button id="activate">Activate</button>
  </div>

  <script>
    const keyInput = document.getElementById('key');
    const errorEl = document.getElementById('error');

    document.getElementById('activate').addEventListener('click', () => {
      const value = keyInput.value.trim();
      if (!value) {
        errorEl.textContent = 'Please enter a license key.';
        return;
      }
      window.licenseAPI.submit(value);
    });

    document.getElementById('cancel').addEventListener('click', () => {
      window.licenseAPI.cancel();
    });

    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('activate').click();
    });

    window.licenseAPI.onPrefillError((message) => {
      errorEl.textContent = message;
    });
  </script>
</body>
</html>
